name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server tests
        working-directory: server
        run: python -m unittest discover -s . -p "test_*.py" -t .
      - name: Setup and extract tests
        run: python -m unittest discover -s tests -t .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file
        run: |
          cp .env.example .env
          printf 'NOBU_PUBLIC_IP=192.0.2.10\nNOBU_ADMIN_TOKEN=ci\n' >> .env
          docker network inspect openlobby >/dev/null 2>&1 || docker network create openlobby
          docker compose config --quiet
      - name: Build (runs the server tests inside the image)
        run: NOBU_REVISION="$GITHUB_SHA" NOBU_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" docker compose build
      - name: The image knows its commit
        run: test "$(docker run --rm psnaga:local printenv NOBU_REVISION)" = "$GITHUB_SHA"
      - name: The TLS terminator speaks SSLv3 / TLS 1.0
        run: docker run --rm --entrypoint /opt/ssl3/bin/openssl psnaga-ssl3:local ciphers -ssl3 DES-CBC3-SHA
