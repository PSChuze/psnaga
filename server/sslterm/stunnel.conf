; Nobunaga login HTTPS terminator. The PS2 client sends an SSLv2-format
; ClientHello offering up to TLS 1.0 with 3DES/RC4/DES/export suites.
foreground = yes
debug = 5
output = /dev/stdout
pid =

[login]
accept  = 0.0.0.0:9443
connect = auth:18080
cert = /certs/login.pem
sslVersionMin = SSLv3
sslVersionMax = TLSv1
options = -NO_SSLv3
ciphers = DES-CBC3-SHA:RC4-SHA:RC4-MD5:EDH-RSA-DES-CBC3-SHA:DES-CBC-SHA:EXP-RC4-MD5:EXP-DES-CBC-SHA:@SECLEVEL=0
renegotiation = no
